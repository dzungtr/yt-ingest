[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yt-ingest"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "youtube-transcript-api>=0.6",
    "yt-dlp>=2024.1",
    "webvtt-py>=0.4",
    "faster-whisper>=1.0",
    "openai>=1.30",
    "tiktoken>=0.7",
    "pydantic>=2.0",
    "jinja2>=3.1",
    "typer>=0.12",
    "sentence-transformers>=3.0",
    "faiss-cpu>=1.8",
    "langchain-text-splitters>=0.2",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.14",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-pyyaml",
]

[project.scripts]
yt-ingest = "yt_ingest.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/yt_ingest"]

[tool.ruff]
src = ["src"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
strict = true
packages = ["yt_ingest"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
